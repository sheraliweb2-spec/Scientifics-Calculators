<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calc Pro</title>
<style>
*{box-sizing:border-box;margin:0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--tx:#14182b;--mu:#6b7194;--bg:linear-gradient(135deg,#dfe7ff,#f5e6ff 60%,#ffe9e0);--gl:rgba(255,255,255,.62);--bd:rgba(255,255,255,.9);--k:rgba(255,255,255,.85);--f:rgba(99,102,241,.12);--o:#6366f1;--dg:#ef4444;--grid:rgba(100,110,150,.2);--axis:#445;--sh:0 6px 18px rgba(70,80,140,.14)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--tx:#eef0ff;--mu:#9aa0c8;--bg:linear-gradient(135deg,#0a0f1f,#1b1240 60%,#0f1d2e);--gl:rgba(255,255,255,.07);--bd:rgba(255,255,255,.13);--k:rgba(255,255,255,.1);--f:rgba(129,140,248,.2);--grid:rgba(255,255,255,.1);--axis:#aab;--sh:0 6px 18px rgba(0,0,0,.4)}}
:root[data-theme=dark]{--tx:#eef0ff;--mu:#9aa0c8;--bg:linear-gradient(135deg,#0a0f1f,#1b1240 60%,#0f1d2e);--gl:rgba(255,255,255,.07);--bd:rgba(255,255,255,.13);--k:rgba(255,255,255,.1);--f:rgba(129,140,248,.2);--grid:rgba(255,255,255,.1);--axis:#aab;--sh:0 6px 18px rgba(0,0,0,.4)}
html,body{min-height:100%}
body{font:16px/1.4 system-ui,sans-serif;color:var(--tx);background:var(--bg) fixed;background-color:#dfe7ff;padding:10px 10px 84px}
.wrap{max-width:1000px;margin:auto}
.glass{background:var(--gl);border:1px solid var(--bd);border-radius:20px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:var(--sh)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;margin-bottom:10px}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff;display:flex;align-items:center;justify-content:center}
h1{font-size:1.1rem;line-height:1.1}.sub{font-size:.7rem;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}h3{margin-bottom:6px}
button,select,input,textarea{font:inherit;color:inherit}
button{border:0;cursor:pointer;background:var(--k);border-radius:14px;transition:.15s}
button:hover{filter:brightness(1.1)}button:active{transform:scale(.94)}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
i{display:flex;font-style:normal}
nav{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:6px;z-index:9;max-width:700px;margin:auto}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;background:none;font-size:.72rem;font-weight:600}
nav .on{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}
@media(min-width:700px){nav button{flex-direction:row;justify-content:center;gap:6px;font-size:.9rem}}
.tab{display:none;padding:14px}.tab.on{display:block}
.disp{padding:12px 16px;border-radius:16px;background:var(--f);text-align:right;margin-bottom:10px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.bar button{padding:6px 11px;font-size:.8rem;display:flex;gap:4px;align-items:center;background:var(--f);font-weight:600}
#mi{color:var(--o);font-weight:700;margin-left:auto}
#ex{min-height:1.5em;color:var(--mu);overflow-x:auto;white-space:nowrap}
#res{font-size:clamp(2.1rem,9vw,3.4rem);font-weight:600;overflow-x:auto;white-space:nowrap;min-height:1.2em}
#res.err{color:var(--dg);font-size:1.2rem}
.pad{display:grid;gap:10px;margin-top:10px}.pad:not(.sc) #sci{display:none}
@media(min-width:860px){.pad.sc{grid-template-columns:1.2fr 1fr}#sci{order:-1}}
.g{display:grid;gap:8px}.sci{grid-template-columns:repeat(auto-fill,minmax(62px,1fr))}.key{grid-template-columns:repeat(4,1fr)}.mem{grid-template-columns:repeat(5,1fr)}
.g button{min-height:50px;font-size:1.05rem;box-shadow:var(--sh)}
.mem button{min-height:34px;font-size:.85rem;background:var(--f);font-weight:600}
.n{font-weight:600;font-size:1.25rem!important}
.f{background:var(--f)!important;font-size:.9rem!important}
.o{background:linear-gradient(135deg,#6366f1,#8b5cf6)!important;color:#fff;font-size:1.3rem!important}
.eqb{background:linear-gradient(135deg,#10b981,#059669)!important;color:#fff;grid-column:1/-1;font-size:1.4rem!important;font-weight:700}
.dg{color:var(--dg);font-weight:700}
#hist{display:none;max-height:220px;overflow:auto;margin-top:10px;padding:10px}#hist.show{display:block}
#hl{list-style:none;padding:0}#hl li{display:flex;justify-content:space-between;gap:8px;padding:6px 2px;border-bottom:1px solid var(--bd)}
.hi{cursor:pointer;overflow-x:auto}.mu{color:var(--mu)}#hl button{background:none;padding:2px 8px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--f);outline:none}
select option{color:#000}
label{display:block;font-size:.8rem;color:var(--mu);margin:8px 0 2px}
.card{padding:16px}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.row{display:flex;gap:8px;align-items:center}.row button{padding:10px 14px}
pre.out{margin-top:10px;white-space:pre-wrap;font:.9rem ui-monospace,monospace;background:var(--f);padding:10px;border-radius:12px;min-height:2.6em;overflow-x:auto}
.err{color:var(--dg)}
canvas{width:100%;height:min(58vh,500px);border-radius:14px;background:var(--f);touch-action:none;display:block;margin-top:8px}
details{margin-top:10px}summary{cursor:pointer;color:var(--mu)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--o);color:#fff;padding:8px 16px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:20}.toast.on{opacity:1}
#fatal{display:none;background:#ef4444;color:#fff;padding:8px 12px;border-radius:12px;margin-bottom:8px;font-size:.85rem}
</style></head>
<body><div class="wrap"><div id="fatal"></div>
<header class="glass"><div class="brand"><span class="logo" data-ic="calc"></span><div><h1>Calc Pro</h1><div class="sub">Scientific Calculator</div></div></div>
<button id="th" title="Dark / light" aria-label="Theme" style="padding:10px"></button></header>
<nav class="glass" aria-label="Tools"><button data-t="calc" class="on"><i data-ic="calc"></i>Calc</button><button data-t="conv"><i data-ic="conv"></i>Convert</button><button data-t="tools"><i data-ic="sig"></i>Tools</button><button data-t="mat"><i data-ic="mat"></i>Matrix</button><button data-t="graph"><i data-ic="graph"></i>Graph</button></nav>
<main>
<section id="calc" class="tab glass on">
<div class="disp"><div class="bar"><button id="ang" title="Angle mode DEG/RAD/GRAD">DEG</button><button id="nf" title="Format NORM/SCI/ENG">NORM</button><button id="sc" title="Show/hide scientific keys">Sci ▾</button><button id="cp" title="Copy result"><i data-ic="copy"></i>Copy</button><button id="hb" title="History"><i data-ic="hist"></i>History</button><span id="mi"></span></div>
<div id="ex"></div><div id="res">0</div></div>
<div class="g mem"><button data-a="mc" title="Memory clear">MC</button><button data-a="mr" title="Memory recall">MR</button><button data-a="mp" title="Memory add">M+</button><button data-a="mm" title="Memory subtract">M−</button><button data-a="ms" title="Memory store">MS</button></div>
<div class="pad sc" id="pad"><div id="key" class="g key"></div><div id="sci" class="g sci"></div></div>
<div id="hist" class="glass"><div class="bar"><b>History</b><button id="hc"><i data-ic="trash"></i>Clear all</button></div><ul id="hl"></ul></div>
</section>
<section id="conv" class="tab"><div class="grid">
<div class="glass card"><h3>Unit converter</h3><label>Category<select id="ccat"></select></label><label>Value<input id="cval" type="number" step="any" value="1"></label><label>From / To</label><div class="row"><select id="cfrom"></select><button id="csw">⇄</button><select id="cto"></select></div><pre class="out" id="cout"></pre></div>
<div class="glass card"><h3>Currency converter</h3><label>Amount<input id="ramt" type="number" step="any" value="100"></label><label>From / To</label><div class="row"><select id="rf"></select><button id="rsw">⇄</button><select id="rt"></select></div><pre class="out" id="rout"></pre>
<details><summary>Edit rates (per 1 USD)</summary><div id="rates"></div></details><p class="mu" style="font-size:.8rem;margin-top:8px">Rates are sample values saved on your device; edit them for exact results.</p></div></div></section>
<section id="tools" class="tab"><div class="grid" id="tg"></div></section>
<section id="mat" class="tab"><div class="glass card"><h3>Matrix calculator</h3><div class="grid"><label>Matrix A (one row per line)<textarea id="ma" rows="4">1 2
3 4</textarea></label><label>Matrix B<textarea id="mb" rows="4">5 6
7 8</textarea></label></div>
<div class="bar" id="mops" style="margin-top:10px"><button data-m="add">A + B</button><button data-m="sub">A − B</button><button data-m="mul">A × B</button><button data-m="det">det(A)</button><button data-m="inv">A⁻¹</button><button data-m="tr">Aᵀ</button></div><pre class="out" id="mo"></pre></div></section>
<section id="graph" class="tab glass"><label>Functions, separate with ;</label><input id="gf" value="y = x^2; y = sin(x); y = 2x + 5">
<div class="bar" style="margin-top:8px"><button id="gi">＋ Zoom in</button><button id="go">－ Zoom out</button><button id="gr">Reset</button></div><canvas id="cv"></canvas><p id="ge" class="err"></p><p class="mu" style="font-size:.8rem">Drag to move. Trig uses radians here.</p></section>
</main></div><div class="toast" id="toast"></div>
<script>
var $=function(s,r){return(r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function fatal(m){var f=$('#fatal');f.style.display='block';f.textContent='Error: '+m}
function safe(fn){try{fn()}catch(e){fatal(e.message)}}
var store={get:function(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(_){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return'&#'+c.charCodeAt(0)+';'})};
var IC={calc:'<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 6h6M9 11h.01M12 11h.01M15 11h.01M9 15h.01M12 15h.01M15 15h.01M9 19h6"/>',conv:'<path d="M7 7h13l-3-3M17 17H4l3 3"/>',sig:'<path d="M18 6H6l6 6-6 6h12"/>',mat:'<path d="M8 4H5v16h3M16 4h3v16h-3"/>',graph:'<path d="M3 3v18h18M7 15l4-5 3 3 5-7"/>',moon:'<path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/>',hist:'<path d="M3 12a9 9 0 109-9 9 9 0 00-7 3.5M3 4v4h4M12 7v5l3 2"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'};
function ic(n){return'<svg viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>'}
$$('[data-ic]').forEach(function(e){e.innerHTML=ic(e.getAttribute('data-ic'))});

/* Math engine (no eval) */
var ang=store.get('ang','DEG'),nf=store.get('nf','NORM'),ans=0;
function toRad(x){return ang==='DEG'?x*Math.PI/180:ang==='GRAD'?x*Math.PI/200:x}
function fromRad(x){return ang==='DEG'?x*180/Math.PI:ang==='GRAD'?x*200/Math.PI:x}
function z(v){return Math.abs(v)<1e-14?0:v}
function dom(c,m){if(!c)throw Error(m)}
function div(a,b){if(b===0)throw Error('Cannot divide by zero');return a/b}
function pw(a,b){if(a===0&&b<0)throw Error('Cannot divide by zero');var r=Math.pow(a,b);if(isNaN(r))throw Error('Invalid power');return r}
function fact(n){if(n<0||n%1!==0)throw Error('Factorial needs integer ≥ 0');if(n>170)throw Error('Result too large');var r=1;for(var i=2;i<=n;i++)r*=i;return r}
var F={sin:function(x){return z(Math.sin(toRad(x)))},cos:function(x){return z(Math.cos(toRad(x)))},
tan:function(x){var c=z(Math.cos(toRad(x)));dom(c,'tan undefined');return Math.sin(toRad(x))/c},
cot:function(x){var s=z(Math.sin(toRad(x)));dom(s,'cot undefined');return Math.cos(toRad(x))/s},
sec:function(x){var c=z(Math.cos(toRad(x)));dom(c,'sec undefined');return 1/c},
csc:function(x){var s=z(Math.sin(toRad(x)));dom(s,'csc undefined');return 1/s},
asin:function(x){dom(Math.abs(x)<=1,'Domain error (−1 to 1)');return fromRad(Math.asin(x))},
acos:function(x){dom(Math.abs(x)<=1,'Domain error (−1 to 1)');return fromRad(Math.acos(x))},
atan:function(x){return fromRad(Math.atan(x))},sinh:Math.sinh,cosh:Math.cosh,tanh:Math.tanh,
log:function(x){dom(x>0,'log needs x > 0');return Math.log(x)/Math.LN10},ln:function(x){dom(x>0,'ln needs x > 0');return Math.log(x)},
exp:Math.exp,sqrt:function(x){dom(x>=0,'√ of negative number');return Math.sqrt(x)},cbrt:Math.cbrt,abs:Math.abs,floor:Math.floor,ceil:Math.ceil,fact:fact,
rand:function(){return Math.random()},mod:function(a,b){dom(b,'Cannot divide by zero');return((a%b)+b)%b},
root:function(n,x){dom(n,'Root index is 0');if(x<0){dom(n%1===0&&n%2,'Even root of negative');return-Math.pow(-x,1/n)}return Math.pow(x,1/n)}};
function hasF(k){return Object.prototype.hasOwnProperty.call(F,k)}
function compile(src){
 src=src.replace(/×/g,'*').replace(/÷/g,'/').replace(/[−–]/g,'-').replace(/π/g,' pi ');
 var t=[],re=/\s*(?:(\d+\.?\d*(?:E[+-]?\d+)?|\.\d+(?:E[+-]?\d+)?)|([A-Za-z]+)|(.))/g,m;
 while((m=re.exec(src))!==null&&m[0]!==''){if(m[1]!==undefined)t.push({n:+m[1]});else if(m[2])t.push({i:m[2].toLowerCase()});else if(m[3]&&m[3].trim())t.push({o:m[3]})}
 var p=0;function pk(){return t[p]}function nx(){return t[p++]}function is(c){return t[p]&&t[p].o===c}
 function E(){var l=T();while(pk()&&(pk().o==='+'||pk().o==='-')){var o=nx().o,a=l,r=T();l=o==='+'?(function(a,r){return function(v){return a(v)+r(v)}})(a,r):(function(a,r){return function(v){return a(v)-r(v)}})(a,r)}return l}
 function T(){var l=U();for(;;){var k=pk();if(!k)break;var o;
  if(k.o==='*'||k.o==='/'){nx();o=k.o}else if(k.i==='mod'){nx();o='m'}else if(k.n!==undefined||k.i||k.o==='(')o='*';else break;
  var a=l,r=U();l=(function(a,r,o){return function(v){return o==='*'?a(v)*r(v):o==='/'?div(a(v),r(v)):F.mod(a(v),r(v))}})(a,r,o)}return l}
 function U(){if(is('-')){nx();var a=U();return function(v){return-a(v)}}if(is('+')){nx();return U()}return W()}
 function W(){var a=Q();if(is('^')){nx();var e=U();return function(v){return pw(a(v),e(v))}}return a}
 function Q(){var a=P();for(;;){var b=a;if(is('!')){nx();a=(function(b){return function(v){return fact(b(v))}})(b)}else if(is('%')){nx();a=(function(b){return function(v){return b(v)/100}})(b)}else break}return a}
 function P(){var k=nx();if(!k)throw Error('Incomplete expression');
  if(k.n!==undefined)return function(){return k.n};
  if(k.o==='('){var a=E();if(!is(')'))throw Error('Missing )');nx();return a}
  if(k.i){
   if(hasF(k.i)&&is('(')){nx();var g=[];if(!is(')')){do g.push(E());while(is(',')&&nx())}if(!is(')'))throw Error('Missing )');nx();var fn=F[k.i];return function(v){return fn.apply(null,g.map(function(a){return a(v)}))}}
   if(k.i==='pi')return function(){return Math.PI};if(k.i==='e')return function(){return Math.E};if(k.i==='ans')return function(){return ans};
   if(k.i==='x')return function(v){if(v.x===undefined)throw Error('x has no value here');return v.x};
   throw Error('Unknown: '+k.i)}
  throw Error('Unexpected "'+k.o+'"')}
 var f=E();if(p<t.length)throw Error('Unexpected "'+(t[p].o||t[p].i||t[p].n)+'"');return f}
function calc(src,vars){var o=(src.match(/\(/g)||[]).length-(src.match(/\)/g)||[]).length;if(o>0)src+=new Array(o+1).join(')');
 var r=compile(src)(vars||{});if(typeof r!=='number'||isNaN(r))throw Error('Invalid input');if(!isFinite(r))throw Error('Result too large');return r}
function fmt(v,m){m=m||nf;if(v===0)return'0';v=+v.toPrecision(15);var a=Math.abs(v);
 if(m==='SCI'||(m==='NORM'&&(a>=1e15||a<1e-9)))return v.toExponential().toUpperCase().replace('E+','E');
 if(m==='ENG'){var e=Math.floor(Math.log10(a)/3)*3;if(e)return(+(v/Math.pow(10,e)).toPrecision(12))+'E'+e}
 return String(v).toUpperCase().replace('E+','E')}

/* Calculator UI */
var SCI=[['sin','sin(','Sine'],['cos','cos(','Cosine'],['tan','tan(','Tangent'],['cot','cot(','Cotangent'],['sec','sec(','Secant'],['csc','csc(','Cosecant'],['sin⁻¹','asin(','Inverse sine'],['cos⁻¹','acos(','Inverse cosine'],['tan⁻¹','atan(','Inverse tangent'],['sinh','sinh(','Hyperbolic sine'],['cosh','cosh(','Hyperbolic cosine'],['tanh','tanh(','Hyperbolic tangent'],['log','log(','Log base 10'],['ln','ln(','Natural log'],['eˣ','exp(','e to the x'],['x²','^2','Square'],['x³','^3','Cube'],['xʸ','^','Power'],['√x','sqrt(','Square root'],['∛x','cbrt(','Cube root'],['ʸ√x','root(','nth root: root(n, x)'],['n!','!','Factorial'],['|x|','abs(','Absolute value'],['1/x','1/(','Reciprocal'],['π','π','Pi'],['e','e','Euler number'],['Rand','rand()','Random 0 to 1'],['⌊x⌋','floor(','Floor'],['⌈x⌉','ceil(','Ceiling'],['mod',' mod ','Modulo'],['EE','E','Scientific notation: 3E4'],['Ans','ans','Previous answer']];
function nk(n){return[n,'i',n,'n']}
var KEY=[['C','a','clr','dg'],['⌫','a','bs','f'],['(','i','(','f'],[')','i',')','f'],nk('7'),nk('8'),nk('9'),['÷','i','÷','o'],nk('4'),nk('5'),nk('6'),['×','i','×','o'],nk('1'),nk('2'),nk('3'),['−','i','−','o'],nk('0'),nk('.'),['%','i','%','f'],['+','i','+','o']];
var ex='',pv='',done=false,errMsg='',mem=store.get('mem',0),hist=store.get('hist',[]);
function render(){$('#ex').textContent=done?pv:ex;var r='0',c='';
 if(errMsg){r=errMsg;c='err'}else if(done)r=ex;else if(ex){try{r=fmt(calc(ex))}catch(_){r=''}}
 var R=$('#res');R.textContent=r;R.className=c;$('#mi').textContent=mem?'M':'';$('#ang').textContent=ang;$('#nf').textContent=nf}
function ins(s){errMsg='';if(done){if(!/^(\^|%|!| mod |E|[+×÷−])/.test(s))ex='';done=false}
 if(/[a-z]$/i.test(ex)&&/^[a-z]/i.test(s))ex+=' ';ex+=s;render()}
function eq(){if(!ex||done)return;var r=calc(ex),s=fmt(r);hist.unshift({e:ex,r:s});hist=hist.slice(0,100);store.set('hist',hist);ans=r;pv=ex+' =';ex=s;done=true;rh()}
function val(){return calc(ex||'0')}
function act(a){errMsg='';try{
 if(a==='clr'){ex='';done=false}else if(a==='bs'){if(done){ex='';done=false}else ex=ex.replace(/([a-z]+\(|ans| mod |.)$/,'')}
 else if(a==='eq')eq();else if(a==='mc')mem=0;else if(a==='mr')ins(fmt(mem));else if(a==='mp')mem+=val();else if(a==='mm')mem-=val();else if(a==='ms')mem=val()
 }catch(e){errMsg=e.message}store.set('mem',mem);render()}
function rh(){$('#hl').innerHTML=hist.length?hist.map(function(h,i){return'<li><span class="hi" data-n="'+i+'">'+esc(h.e)+' = <b>'+esc(h.r)+'</b></span><button data-d="'+i+'" aria-label="Delete">✕</button></li>'}).join(''):'<li class="mu">No history yet</li>'}
var tab='calc',root=document.documentElement;
safe(function(){
 $('#sci').innerHTML=SCI.map(function(r){return'<button class="f" data-i="'+esc(r[1])+'" title="'+r[2]+'">'+r[0]+'</button>'}).join('');
 $('#key').innerHTML=KEY.map(function(r){return'<button class="'+r[3]+'" data-'+r[1]+'="'+r[2]+'">'+r[0]+'</button>'}).join('')+'<button class="eqb" data-a="eq" title="Equals (Enter)">=</button>';
 $('#calc').addEventListener('click',function(e){var b=e.target.closest('button');if(!b||!b.closest('.pad,.mem'))return;var i=b.getAttribute('data-i');if(i!==null)ins(i);else act(b.getAttribute('data-a'))});
